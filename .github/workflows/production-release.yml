name: Production Release Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-quality:
    name: Application Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependency security
        run: npm audit --omit=dev

      - name: Gate 1 - Production build
        run: npm run build

      - name: Gate 2 - Automated unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate 5 - Accessibility
        run: npm run test:a11y

      - name: Gate 6 - Core user flow
        run: npm run test:e2e

  database-security:
    name: Database and Security Gates
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Link Supabase project
        run: >
          npx supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Gate 3 - Data migration integrity
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const project = process.env.SUPABASE_PROJECT_ID;
          const password = process.env.SUPABASE_DB_PASSWORD;
          if (!project || !password) {
            console.error("Required database secrets are missing.");
            process.exit(1);
          }
          const url = new URL(
            "postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres"
          );
          url.username = `postgres.${project}`;
          url.password = password;
          url.searchParams.set("sslmode", "require");
          console.log(`::add-mask::${url.password}`);
          console.log(`::add-mask::${url.href}`);
          const result = spawnSync(
            "npm",
            ["run", "check:migrations", "--", "--db-url", url.href],
            { stdio: "inherit" }
          );
          if (result.error) {
            console.error("Could not start the migration dry run.");
          }
          process.exit(result.status ?? 1);
          NODE

      - name: Gate 4 - Row-Level Security enforcement
        run: npm run test:rls

  production-deployment:
    name: Production Deployment Gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - application-quality
      - database-security
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Pull Vercel production configuration
        run: >
          npx --yes vercel@65.12.1 pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: >
          npx --yes vercel@65.12.1 build
          --prod
          --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        id: deploy
        run: |
          deployment_url="$(
            npx --yes vercel@65.12.1 deploy \
              --prebuilt \
              --prod \
              --token="$VERCEL_TOKEN"
          )"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Gate 7 - Deployment smoke test
        id: smoke
        env:
          DEPLOYMENT_URL: https://neighborhood-listing-platform-mauve.vercel.app
        run: npm run test:smoke -- "$DEPLOYMENT_URL"

      - name: Gate 8 - Roll back failed production release
        if: failure() && steps.smoke.outcome == 'failure'
        run: npm run rollback:production


  apply-voice-number-mapping:
    name: Apply reviewed voice number mapping
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/lab/voice-failure-matrix'
    needs:
      - application-quality
      - database-security
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify pending migration and apply
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");

          const project = process.env.SUPABASE_PROJECT_ID;
          const password = process.env.SUPABASE_DB_PASSWORD;
          const expectedProject = "namidyxwopiimpksfumj";

          if (
            project !== expectedProject ||
            !password ||
            new URL(process.env.SUPABASE_URL).hostname !==
              `${expectedProject}.supabase.co`
          ) {
            console.error("Database target mismatch or missing configuration.");
            process.exit(1);
          }

          const url = new URL(
            "postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres"
          );
          url.username = `postgres.${project}`;
          url.password = password;
          url.searchParams.set("sslmode", "require");

          console.log(`::add-mask::${url.password}`);
          console.log(`::add-mask::${url.href}`);

          function run(flags) {
            const result = spawnSync(
              "./node_modules/.bin/supabase",
              ["db", "push", "--db-url", url.href, ...flags],
              { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }
            );

            const output = (result.stdout || "") + (result.stderr || "");
            console.log(output);

            if (result.error || result.status !== 0) {
              console.error("Migration command failed.");
              process.exit(1);
            }

            return output;
          }

          const preview = run(["--dry-run"]);
          const pending = [...new Set(
            preview.match(/\b\d{14}_[A-Za-z0-9_-]+\.sql\b/g) || []
          )];
          const allowed =
            "20261128060000_create_voice_number_routes.sql";

          if (pending.length !== 1 || pending[0] !== allowed) {
            console.error(
              "Stopped: pending migrations differ from the reviewed migration."
            );
            process.exit(1);
          }

          console.log("Applying the reviewed voice number mapping migration.");
          run(["--yes"]);
          NODE
